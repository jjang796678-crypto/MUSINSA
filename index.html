<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSINSA</title>
    <!-- Favicon -->
    <link rel="icon" href="images/Favicon.png">
    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/header.css">

    <link rel="stylesheet" href="css/responsive.css">

    <!-- Java -->
    <script src="js/main.js" defer> </script>


</head>
<body>
    <!-- 전체 레이아웃 -->
    <div class="layout"> 
        <!-- 상단 -->
        <header class="header"> 
            <div class="inner"> 
                <!-- 상단 메뉴 공간 -->
                <div class="head_menu_area"> 
                    <!-- 상단 메뉴 (본 페이지는 ul 사용) -->
                    <div class="menu_list"> 
                        <!-- 로고 & 버튼 -->
                        <div class="menu_left"> 
                            <!-- 로고 -->
                            <div class="logo"> 
                                <img src="images/logo.svg" alt="무신사 로고">
                            </div>
                            <!-- 버튼 -->
                            <ul class="nav"> 
                                <li> <a href="#"> Company </a> </li>
                                <li> <a href="#"> Business </a> </li>
                                <li> <a href="#"> Impact </a> </li>
                                <li> <a href="#"> Newsroom </a> </li>
                                <li> <a href="#"> Career↗ </a> </li>
                            </ul>
                        </div>
                        <!-- 언어 -->
                        <div class="menu_right"> 
                            <div class="lang_area"> 
                                <div class="lang"> 
                                    <!-- 현재 언어 -->
                                    <div> 
                                        <span> KO </span>
                                    </div>
                                    <!-- 아이콘 -->
                                    <img src="images/icon_language.svg" alt="지구본">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 1페이지 -->
                <main> 
                    <div class="news_area"> 
                        <!-- 메인 뉴스 -->
                        <div class="news_main"> 
                            <!-- 메인 뉴스 이미지 -->
                            <div class="news_main_img"> 
                                <img src="images/MUSINSA.jpg" alt="메인 뉴스">
                            </div>
                            <!-- 메인 뉴스 아래 -->
                            <div class="news_main_lower"> 
                                <!-- 메인 뉴스 제목 -->
                                <div class="news_main_lower_title"> 
                                    <a href="#"> 메인 뉴스 제목 </a>
                                </div>
                                <!-- 메인 뉴스 버튼 -->
                                <div class="news_main_lower_btn"> 
                                    <button type="button" class="1"></button>
                                    <button type="button" class="2"></button>
                                    <button type="button" class="3"></button>
                                    <button type="button" class="4"></button>
                                    <button type="button" class="5"></button>
                                </div>
                            </div>
                        </div>
                        <!-- 서브 뉴스 -->
                        <div class="news_sub"> 
                            <!-- 서브 뉴스 영역 -->
                            <div class="news_sub_area"> 
                                <div class="news_sub_area_img"> 
                                    <img src="images/MSS_무한대.jpg" alt="서브 뉴스">
                                </div>
                                <div class="news_sub_area_title"> 
                                    <h3> 무신사 무한대 프로젝트 비하인드 </h3>
                                </div>
                            </div>
                            <!-- 서브 뉴스 버튼 영역 -->
                            <div class="news_sub_btn_area"> 
                                <!-- 위쪽 버튼 영역 -->
                                <div class="news_sub_btn_area_upper"> 
                                    <!-- 링크용 a -->
                                    <a href="#"> 
                                        <!-- 위쪽 버튼 -->
                                        <div class="news_sub_btn_upper"> 
                                            <!-- 위쪽 버튼 텍스트 -->
                                            <div class="news_sub_btn_upper_txt"> 
                                                <span> Impact </span> 
                                                <p> 2026 무신사 임팩트 리포트 </p>
                                            </div>
                                            <!-- 위쪽 버튼 이미지 -->
                                            <div class="news_sub_btn_upper_img"> 
                                                <img src="images/icon_arrowR_B.svg" alt="오른쪽 화살표">
                                            </div>
                                        </div>
                                    </a>
                                </div>
                                <!-- 아래쪽 버튼 영역 -->
                                <div class="news_sub_btn_area_upper"> 
                                    <!-- 링크용 a -->
                                    <a href="#"> 
                                        <!-- 아래쪽 버튼 -->
                                        <div class="news_sub_btn_upper"> 
                                            <!-- 아래쪽 버튼 텍스트 -->
                                            <div class="news_sub_btn_upper_txt"> 
                                                <span> 더 알아보기 </span> 
                                                <p> 무신사 오프라인 스토어 </p>
                                            </div>
                                            <!-- 아래쪽 버튼 이미지 -->
                                            <div class="news_sub_btn_upper_img"> 
                                                <img src="images/icon_arrowR_B.svg" alt="오른쪽 화살표">
                                            </div>
                                        </div>
                                    </a>
                                </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </header>
        <!-- 2 페이지 -->
        <section> 

        </section>
    </div>
</body>
</html>
